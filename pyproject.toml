[project]
name = "hoops-data"
version = "0.1.0"
description = "Data pipeline for Hoops: An Uncommon Field Guide to the Game of Basketball"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoops_data"]

[tool.uv]
dev-dependencies = []
