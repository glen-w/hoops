[project]
name = "hoops"
version = "0.1.0"
description = "Data processing for Hoops: An Uncommon Field Guide to Basketball"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "kaggle>=1.6.0",
]

# Note: nba-api and other transform dependencies added by engineer in separate PR

[project.optional-dependencies]
dev = [
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
