[project]
name = "hoops-data"
version = "0.1.0"
description = "Data pipeline for Hoops: An Uncommon Field Guide to the Game of Basketball"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "nba-api>=1.4.0",
    "kaggle>=1.6.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "SPARQLWrapper>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoops_data"]

[dependency-groups]
dev = []

[project.scripts]
hoops = "hoops_data.ask:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
